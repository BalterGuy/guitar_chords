<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b5e83" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css?v=5.1" />
  <title>אקורדים לגיטרה</title>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>אקורדים לגיטרה</h1>
        <p>בחר תו ואחריו את האקורד</p>
      </div>
      <button id="installBtn" class="ghost hidden" type="button">הוסף למסך הבית</button>
    </header>

    <section class="panel">
      <h2>1. תו</h2>
      <div id="roots" class="root-grid"></div>
    </section>

    <section id="qualityPanel" class="panel muted-panel">
      <h2 id="qualityTitle">2. אקורד</h2>
      <div id="qualities" class="quality-grid"></div>
      <button id="moreBtn" class="more-btn hidden" type="button">עוד אקורדים</button>
    </section>

    <section id="chordPanel" class="panel chord-panel hidden">
      <div class="chord-title-row">
        <div class="chord-heading"><div id="chordName" class="chord-name">Am</div><div id="rootItalian" class="root-italian">La</div></div>
        <button id="favBtn" class="fav" type="button" aria-label="שמירה למועדפים">☆</button>
      </div>

      <div class="diagram-wrap">
        <svg id="diagram" viewBox="0 0 340 430" role="img" aria-label="דיאגרמת אקורד"></svg>
      </div>

      <button id="playChord" class="play-btn" type="button" aria-label="נגן אקורד">▶&nbsp;&nbsp;נגן אקורד</button>

      <div class="voicing-row">
        <button id="prevVoicing" class="nav-btn" type="button">‹ אחיזה קודמת</button>
        <span id="voicingCounter"></span>
        <button id="nextVoicing" class="nav-btn" type="button">אחיזה הבאה ›</button>
      </div>

    </section>

    <section class="panel compact">
      <h2>אחרונים</h2>
      <div id="recent" class="chips"><span class="empty">עדיין אין אקורדים</span></div>
    </section>

    <section class="panel compact">
      <h2>מועדפים</h2>
      <div id="favorites" class="chips"><span class="empty">אפשר לשמור עם ☆</span></div>
    </section>
  </main>

  <script src="app.js?v=5.1"></script>
</body>
</html>
